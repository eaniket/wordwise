<!DOCTYPE html>
<html>
<head>
  <title>WordWise</title>
  <script src="https://kit.fontawesome.com/fde51b9894.js" crossorigin="anonymous"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/read.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
  <script>
    function backToHome(){
        window.location.href="{{ url_for('start')}}"
    }
  </script>
</head>
<body>
  <div class="page-wrapper">
    <nav class="" id="">
      <div class="logo">
        <!-- <img src="./assets/logo_1.svg"/> -->
        <h1 onclick="backToHome()"><i class="fa-solid fa-lightbulb"></i> WordWise</h1>
        <a href="#">
        </a>
      </div>
      <div class="menu-toggle">&#9776;</div>
    </nav>

     <div id="body" class="main-body">
      <div class="main content" id="main-content">
        <h1>{{ doc_data.title }}</h1>
        <div class="narrative">
          {{ doc_data.narrative }}
        </div>
        <div class="words">
          <h3>References:</h3>
          {% for i in doc_data.words %}
            <div><strong>{{ i.word }}</strong>({{ i.type }}) : {{ i.meaning }} </div>
          {% endfor %}
        </div>
      </div>
     </div>
  </div>

  <script defer src="script.js" type="text/javascript"></script>
</body>
</html>
