<!DOCTYPE html>
<html>
<head>
  <title>WordWise</title>
  <script src="https://kit.fontawesome.com/fde51b9894.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/read.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
  <script>
    function calcTime(totalSeconds){
      var mins = document.getElementById("mins");
      var secs = document.getElementById("secs");
      var minutes = Math.floor(totalSeconds/60);
      var seconds = Math.floor(totalSeconds%60);
      mins.innerHTML = minutes<10 ? "0"+minutes: minutes;
      secs.innerHTML = seconds<10 ? "0"+seconds : seconds ;
    }

    function triggerTimer(){
      var words = document.getElementById("doc-words");
      words = parseInt(words.value);
      var totalSeconds = words*2.5;
      calcTime(totalSeconds);
      setInterval(() => {
        if(totalSeconds > 0){
          totalSeconds = totalSeconds - 1;
          calcTime(totalSeconds);
        }
        else{
          var timer = document.getElementById("timer");
          timer.classList.remove("btn-success");
          timer.classList.add("btn-danger");
          timer.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i>'+" Time is over";
          return;
        }
      }, 1000)
    }

    function setTimer(){
      const myModal = new bootstrap.Modal('#staticBackdrop');
      myModal.show();
    }

    function backToHome(){
        window.location.href="{{ url_for('start')}}"
    }
  </script>
</head>
<body onload="setTimer()">
  <div class="page-wrapper">
    <nav class="" id="">
      <div class="logo">
        <!-- <img src="./assets/logo_1.svg"/> -->
        <h1 onclick="backToHome()"><i class="fa-solid fa-lightbulb"></i> WordWise</h1>
        <a href="#">
        </a>
      </div>
      <div class="menu-toggle">&#9776;</div>
    </nav>

     <div id="body" class="main-body">
      <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="staticBackdropLabel">Timer will start <i class="fa-solid fa-hourglass-end"></i></h1>
              <!-- <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" onclick="triggerTimer()"></button> -->
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-primary" data-bs-dismiss="modal" onclick="triggerTimer()">Understood</button>
            </div>
          </div>
        </div>
      </div>
      <div class="main content" id="main-content">
        <h1>{{ doc_data.title }}</h1>
        <div class="float-action btn btn-success btn-lg" id="timer"><i class="fa-solid fa-stopwatch"></i>
          </p><p id="mins"> 00 </p><p>:</p><p id="secs"> 00</p>
        </div>
        <div class="narrative">
          {{ doc_data.narrative }}
        </div>
        <input type="hidden" name="" id="doc-words" value="{{doc_data.narrative_word_count}}">
        <div class="words">
          <h3>References:</h3>
          {% for i in doc_data.words %}
            <div><strong>{{ i.word }}</strong>({{ i.type }}) : {{ i.meaning }} </div>
          {% endfor %}
        </div>
      </div>
     </div>
  </div>

  <script defer src="script.js" type="text/javascript"></script>
</body>
</html>
