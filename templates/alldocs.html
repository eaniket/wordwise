<!DOCTYPE html>
<html>
<head>
  <title>WordWise</title>
  <script src="https://kit.fontawesome.com/fde51b9894.js" crossorigin="anonymous"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/read.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
  <script>
    function triggerNav(param){
      window.location.href="{{ url_for('read_page', doc_id = 'DOC_ID') }}".replace("DOC_ID", param);
    }

    function backToHome(){
        window.location.href="{{ url_for('start')}}"
    }
  </script>
</head>
<body>
  <div class="page-wrapper">
    <nav class="" id="">
      <div class="logo">
        <!-- <img src="./assets/logo_1.svg"/> -->
        <h1 onclick="backToHome()"><i class="fa-solid fa-lightbulb"></i> WordWise</h1>
        <a href="#">
        </a>
      </div>
      <div class="menu-toggle">&#9776;</div>
    </nav>

     <div id="body" class="main-body">
      <div class="main container" id="explore-content">
        <div class="story-heading">
          <h1>Curated Stories</h1>
        </div>
        <div class="row-container">
          <div class="row">
            
            {% for i in all_docs %}
                <div class="gpt-card grow-card" onclick="triggerNav('{{i.id}}')">
                  <img src="{{url_for('static', filename='assets/Book.jpg')}}" class="card-img" alt="Image">
                  <div class="card-content">
                    <h5 class="card-title">
                      {{i.title}}
                    </h5>
                    <div class="badges">
                      {% for j in i.words %}
                        <span class="badge">{{j.word}}</span>
                      {% endfor %}
                    </div>
                  </div>
                </div>
            {% endfor %}
          </div>
        </div>
      </div>
      
     </div>

    <footer>
    </footer>
  </div>

  <script defer src="script.js" type="text/javascript"></script>
</body>
</html>
